# Gradle JVM heap. AGP + Compose compile is heavy.
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use AndroidX (must be on for AGP 7+).
android.useAndroidX=true

# Configuration cache + build cache for faster local iteration.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Run independent project tasks in parallel.
org.gradle.parallel=true

# Kotlin: parallel + incremental compilation.
kotlin.code.style=official
kotlin.incremental=true

# Non-transitive R class — required for clean modular splits in
# follow-up PRs (P3-01c).
android.nonTransitiveRClass=true
