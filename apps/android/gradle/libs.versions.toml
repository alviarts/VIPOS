[versions]
agp = "8.5.2"
kotlin = "1.9.24"
# Compose compiler must be matched against the Kotlin version per
# https://developer.android.com/jetpack/androidx/releases/compose-kotlin
# 1.5.14 is the canonical pair for Kotlin 1.9.24.
composeCompiler = "1.5.14"

# Hilt + KSP (P3-01b). KSP is the canonical Hilt annotation processor
# since Hilt 2.48; the KSP version is locked to the Kotlin version per
# https://github.com/google/ksp/releases.
hilt = "2.51.1"
ksp = "1.9.24-1.0.20"

coreKtx = "1.13.1"
coreSplashscreen = "1.0.1"
lifecycle = "2.8.4"
activityCompose = "1.9.1"
composeBom = "2024.06.00"

# Networking stack (P3-05). Retrofit 2.11.0 ships the official
# `retrofit2:converter-kotlinx-serialization` artifact (replacing
# the JakeWharton third-party converter that was used for 2.9 and
# below). OkHttp 4.12.0 is the latest 4.x LTS — moving to 5.x would
# pull okio 3.x and JDK 11 runtime so we stay on 4.x for the
# Phase 3 timeframe.
okhttp = "4.12.0"
retrofit = "2.11.0"
kotlinxSerialization = "1.6.3"

# Persistence (P3-03a). DataStore Preferences is the modern
# replacement for SharedPreferences and is the recommended store
# for small key/value data such as auth tokens.
datastore = "1.1.1"

# Room (P3-04). Latest 2.6.x; 2.7.x is in alpha. Room ships
# coroutine + Flow support out of the box via room-ktx and
# generates DAO impls at compile time via KSP.
room = "2.6.1"

# Coroutines (P3-03a). The auth repository exposes Flow<...> APIs
# and uses suspend functions to talk to OkHttp. The version is
# whatever is current with Kotlin 1.9.24.
kotlinxCoroutines = "1.8.1"

# Hilt-navigation-compose (P3-03b). Bridges the Hilt graph and
# the AndroidX ViewModel + Navigation Compose APIs, providing the
# `hiltViewModel()` Composable function that resolves the
# `@HiltViewModel`-annotated VM through the activity's Hilt
# component. Version is independent of the core Hilt library.
hiltNavigationCompose = "1.2.0"
lifecycleViewmodelCompose = "2.8.4"

# Navigation-compose (P3-08). The 2.8.x line introduces a type-safe
# destinations API but is still in beta as of mid-2024; pin to the
# latest 2.7.x stable for the Phase 3 timeframe.
navigationCompose = "2.7.7"

# Test stack (P3-10). JUnit 4 is the de-facto standard for Android
# unit tests (AGP's `testDebugUnitTest` task is wired for it).
# MockWebServer ships from the same OkHttp 4.12.x line so its
# bytecode level matches the production OkHttp transitive deps.
# Turbine is Cash App's tiny library for asserting against Flow
# emissions in tests — `flow.test { ... awaitItem() }` is much less
# noisy than the manual `toList(buffer)` + `advanceUntilIdle` dance.
# P3-03: Biometric authentication (fingerprint/face).
biometric = "1.2.0-alpha05"

# P3-09: WorkManager for background outbox drain. 2.9.x is the
# latest stable; 2.10.x is in alpha.
work = "2.9.1"

# Firebase (Crashlytics + Analytics) for production monitoring
# Using Firebase BOM to manage all Firebase library versions
firebaseBom = "33.7.0"
googleServices = "4.4.2"
firebaseCrashlyticsGradle = "3.0.2"

junit = "4.13.2"
turbine = "1.1.0"

# P3-08 slice 5c: ZXing core for QR code generation. The `core`
# artifact is a pure-Java library (no Android dependency) that
# provides the `BarcodeFormat.QR_CODE` encoder. We render the
# resulting `BitMatrix` to a Compose `ImageBitmap` directly —
# no need for the heavier `zxing-android-embedded` wrapper.
zxing = "3.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# P3-06: a small, curated set of Material symbols (Add, ArrowBack,
# Refresh, Remove, etc.) shipped as a separate artifact from
# `material3` so apps that don't use icons don't pay the size
# cost. Version is managed by the compose BOM, hence no explicit
# version.ref here.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# P3-05 networking
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# P3-03a persistence + coroutines (auth token storage).
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# P3-04 Room. room-runtime is the core library; room-ktx layers
# coroutine + Flow extension functions on top; room-compiler is
# the KSP processor that generates DAO + Database implementations.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# P3-03b Compose-Hilt-ViewModel bridge.
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
# `collectAsStateWithLifecycle` ships from lifecycle-runtime-compose,
# NOT lifecycle-viewmodel-compose; the two artifacts are separate.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }

# P3-08 Navigation Compose. Pinned to the latest 2.7.x stable; 2.8.x
# is in beta and brings new type-safe destinations API which is not
# Production-ready yet.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# P3-10 test stack. All `testImplementation`-only — these MUST NOT
# leak into the production classpath.
junit = { group = "junit", name = "junit", version.ref = "junit" }
# `okhttp-mockwebserver` inherits the OkHttp version (4.12.0) so the
# bytecode it talks to lines up exactly with what the production
# stack ships.
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
# P3-08 slice 5c: ZXing core for QR code generation from the
# gateway-issued `qr_code_url` content string.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# `kotlinx-coroutines-test` provides `runTest`, `StandardTestDispatcher`,
# `Dispatchers.setMain`, and friends — required to drive the
# `viewModelScope`-rooted Flow inside `SessionViewModel` deterministically.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# P3-03: Biometric authentication.
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# P3-09: WorkManager for background outbox drain.
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Firebase for production monitoring (Crashlytics + Analytics)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics-ktx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsGradle" }
