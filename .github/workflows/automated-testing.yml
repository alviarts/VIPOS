name: Automated Testing

on:
  schedule:
    # Run tests every day at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vipos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Setup database
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vipos_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vipos_test
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Start backend server
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vipos_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vipos_test
          JWT_SECRET: test-secret-key
          PORT: 3001
        run: npm start &

      - name: Wait for backend
        run: npx wait-on http://localhost:3001/api/health

      - name: Start frontend server
        working-directory: apps/web
        run: npm run dev &

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-videos
          path: test-results/

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests
        run: k6 run scripts/load-test.js
        env:
          API_URL: ${{ secrets.STAGING_API_URL }}

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results.json

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "VIPOS"
          path: "."
          format: "HTML"

      - name: Upload OWASP results
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: reports/

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Run performance tests
        run: |
          npm install -g lighthouse
          lighthouse http://localhost:5173 --output=json --output-path=./lighthouse-report.json

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: lighthouse-report.json

  notify-results:
    name: Notify Test Results
    runs-on: ubuntu-latest
    needs: [e2e-tests, load-tests, security-scan, performance-tests]
    if: always()

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Automated testing completed
            E2E Tests: ${{ needs.e2e-tests.result }}
            Load Tests: ${{ needs.load-tests.result }}
            Security Scan: ${{ needs.security-scan.result }}
            Performance Tests: ${{ needs.performance-tests.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
