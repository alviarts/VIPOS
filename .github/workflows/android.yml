name: Android CI

# Phase 3 task P3-01a — extends `ci.yml`'s coverage to the Android
# scaffold under `apps/android/`. Runs on every PR + push to main; the
# path-filter keeps web/backend-only PRs from blocking on a Gradle
# warm-up.
on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: build (apps/android assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # Pinned to v3 (latest stable). Installs cmdline-tools +
        # accepts licenses; build-tools/platforms are auto-pulled by
        # Gradle when the build runs.
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        # Surfaces the APK as a CI artifact so reviewers can sideload
        # it onto a tablet without setting up a local Android dev env.
        # 7-day retention keeps storage cost trivial.
        uses: actions/upload-artifact@v4
        with:
          name: vipos-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
