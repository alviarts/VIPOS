name: Android CI

# Phase 3 task P3-01a — extends `ci.yml`'s coverage to the Android
# scaffold under `apps/android/`. Runs on every PR + push to main; the
# path-filter keeps web/backend-only PRs from blocking on a Gradle
# warm-up.
on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: build (apps/android assembleDevDebug + assembleStagingDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # Pinned to v3 (latest stable). Installs cmdline-tools +
        # accepts licenses; build-tools/platforms are auto-pulled by
        # Gradle when the build runs.
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: assembleDevDebug + assembleStagingDebug
        # P3-01d: build the two flavors most likely to be sideloaded
        # off CI: dev (emulator-targeted, points at host loopback for
        # the local backend) and staging (points at the VPS endpoint
        # so the founder / engineers can validate against staging
        # without spinning up the local stack). Prod is intentionally
        # deferred — its build is gated on signing config which is
        # not part of the bootstrap series.
        run: ./gradlew :app:assembleDevDebug :app:assembleStagingDebug --no-daemon --stacktrace

      - name: Verify Room schema exports are committed
        # P3-09: schema-export-diff guard. The Room KSP processor
        # (configured in apps/android/core/database/build.gradle.kts via
        # `ksp { arg("room.schemaLocation", ...) }`) writes one JSON
        # file per `@Database` version into
        # `apps/android/core/database/schemas/`. Those JSON files are
        # the canonical source for migration tests in later phases —
        # once a schema lands in `main` its file should NOT be edited;
        # later schema bumps land as new `<version>.json` files plus
        # `Migration` objects.
        #
        # If an entity annotation changes (column added, type narrowed,
        # index dropped, etc.) without a corresponding `version` bump
        # + commit of the regenerated JSON, the next time someone runs
        # the database it'll fail with `IllegalStateException: Room
        # cannot verify the data integrity` — and the offending diff
        # is invisible to PR reviewers because git only sees committed
        # JSON, not what KSP would regenerate.
        #
        # This step closes that gap: after the assemble step (which
        # runs KSP and rewrites the JSON in-place), fail CI if the
        # working tree under `core/database/schemas/` is not clean
        # vs. HEAD. Catches both the "modified" case (entity changed,
        # schema regenerated, contributor forgot to `git add`) and
        # the "untracked" case (version bumped, new `<n>.json` written
        # but not staged).
        #
        # The check uses `git status --porcelain` because plain
        # `git diff` ignores untracked files; both scenarios above
        # produce dirty working-tree state that `--porcelain` surfaces.
        # Run from repo root (overrides the job-level
        # `working-directory: apps/android` default) so the path is
        # reliably `apps/android/core/database/schemas/`.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          schema_dir="apps/android/core/database/schemas"
          dirty=$(git status --porcelain -- "$schema_dir")
          if [ -n "$dirty" ]; then
            {
              echo "::error::Room schema exports under $schema_dir are out of sync."
              echo ""
              echo "The Room KSP processor regenerated schema JSON during this build,"
              echo "but the version on HEAD does not match. This usually means an"
              echo "entity annotation was changed (column added/removed, type changed,"
              echo "index modified) without bumping the @Database version + committing"
              echo "the regenerated <n>.json file."
              echo ""
              echo "To fix locally:"
              echo "  cd apps/android"
              echo "  ./gradlew :app:assembleDevDebug --no-daemon"
              echo "  git add core/database/schemas/"
              echo "  git commit --amend --no-edit  # or as a fixup"
              echo ""
              echo "Dirty working-tree entries:"
              echo "$dirty"
              echo ""
              echo "Diff vs HEAD:"
              git --no-pager diff -- "$schema_dir" || true
            } >&2
            exit 1
          fi
          echo "Room schema exports under $schema_dir are clean vs. HEAD."

      - name: Upload dev debug APK
        # Surfaces the dev-flavor APK as a CI artifact so reviewers
        # can sideload it onto an emulator without setting up a local
        # Android dev env. 7-day retention keeps storage cost trivial.
        uses: actions/upload-artifact@v4
        with:
          name: vipos-android-dev-debug-apk
          path: apps/android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload staging debug APK
        # Staging APK targets the VPS endpoint, so it is the artifact
        # the founder reaches for when validating against the live
        # backend without dev-machine plumbing.
        uses: actions/upload-artifact@v4
        with:
          name: vipos-android-staging-debug-apk
          path: apps/android/app/build/outputs/apk/staging/debug/app-staging-debug.apk
          retention-days: 7
          if-no-files-found: error
