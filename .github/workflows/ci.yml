name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same ref when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (web + backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vipos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d vipos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations + smoke run as the schema owner (postgres superuser).
      DATABASE_URL: postgresql://test:test@localhost:5432/vipos_test
      DIRECT_URL: postgresql://test:test@localhost:5432/vipos_test
      DATABASE_DRIVER: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (root + workspaces)
        run: npm ci

      - name: Apply Prisma migrations to CI Postgres
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Provision non-superuser app role for RLS
        # P2-02: app must connect via a non-superuser role so RLS policies apply.
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U test -d vipos_test -f apps/backend/scripts/setup-app-role.sql

      - name: Build all workspaces
        run: npm run build

      - name: Smoke check backend can start
        env:
          NODE_ENV: production
          JWT_SECRET: ci-smoke-secret
          PORT: 3001
          # Backend itself runs as the non-superuser app role so RLS applies.
          DATABASE_URL: postgresql://vipos_app:apppass@localhost:5432/vipos_test
          DIRECT_URL: postgresql://test:test@localhost:5432/vipos_test
          DATABASE_DRIVER: postgres
        run: |
          # Boot the backend in the background, hit /api/health, then kill it.
          # Proves the production entry point still resolves the new monorepo
          # paths (e.g. ../../web/dist) without throwing.
          (cd apps/backend && node src/index.js &) >/tmp/backend.log 2>&1
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "backend is healthy"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3001/api/health || { echo "health check failed"; cat /tmp/backend.log; exit 1; }
          pkill -f "node src/index.js" || true

  lint:
    name: lint (--if-present)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # No workspace defines a lint script yet (P0-03 will add ESLint/Prettier).
        # `--if-present` makes this a no-op until then so CI stays green.
        run: npm run lint --if-present

  test:
    name: test (--if-present)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vipos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d vipos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # P2-04: BullMQ tests need a real Redis broker. Tests gracefully
      # skip when REDIS_URL is unset, so removing this service still
      # keeps CI green if needed.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests use vipos_app for runtime so RLS policies apply.
      # Migrations still run as the schema owner via DIRECT_URL.
      DATABASE_URL: postgresql://vipos_app:apppass@localhost:5432/vipos_test
      DIRECT_URL: postgresql://test:test@localhost:5432/vipos_test
      DATABASE_DRIVER: postgres
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-vipos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations to CI Postgres
        working-directory: apps/backend
        run: npx prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/vipos_test

      - name: Provision non-superuser app role for RLS
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U test -d vipos_test -f apps/backend/scripts/setup-app-role.sql

      - name: Test
        run: npm test --if-present
