name: Deploy to VPS

# Auto-deploy ke VPS setiap kali main ter-update (biasanya hasil PR squash-merge).
# Workflow ini hanya men-trigger script deploy yang sudah ada di server
# (tools/scripts/deploy.sh) — semua langkah yang sebenarnya jalan di sana.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (default: main)"
        required: false
        default: "main"

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy via ssh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: http://103.74.5.44/vipos/
    steps:
      - name: Setup SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pre-seed known_hosts. ssh-keyscan occasionally fails when a
          # GH Actions runner is in an Azure region with transient
          # connectivity to 103.74.5.44 — runs 25445248136 (PR #158)
          # and 25447094832 (PR #161) both died at this step despite
          # the next-run-from-the-same-PR-set succeeding cleanly.
          # Retry up to 5 times with 3-sec backoff before giving up.
          # If all attempts fail we still let the step pass — the ssh
          # call below uses StrictHostKeyChecking=accept-new, so it
          # can populate known_hosts on first contact and a missing
          # pre-seed only loses the defence-in-depth check, not the
          # actual TLS-style host pinning that ssh does anyway.
          attempts=0
          until ssh-keyscan -T 10 -t ed25519 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 5 ]; then
              echo "[ssh-keyscan] giving up after 5 attempts; relying on StrictHostKeyChecking=accept-new"
              break
            fi
            echo "[ssh-keyscan] attempt $attempts failed, retrying in 3s"
            sleep 3
          done

      - name: Run deploy script on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/id_ed25519 \
              "${VPS_USER}@${VPS_HOST}" \
              "set -euo pipefail; \
               export DEPLOY_PATH='${DEPLOY_PATH}'; \
               export BRANCH='${BRANCH}'; \
               cd \"\$DEPLOY_PATH\" && \
               bash tools/scripts/deploy.sh"

      - name: Smoke check live site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -e
          # Beri server beberapa detik untuk pm2 boot ulang. Single
          # curl tanpa retry pernah blank di run 25445961488 (curl
          # 4 menit hang lalu HTTP 000) padahal backend logs nunjukin
          # process sudah online di 15:52:51 sebelum smoke step jalan
          # di 15:52:53 — jadi ada race antara nginx upstream-pool
          # refresh sama pm2 listen-ready. Stabilkan dengan:
          # - `--retry 5 --retry-delay 3 --retry-connrefused`: ulang 5x
          #   max (~15 detik) kalau dapet connection-refused / 5xx /
          #   transient errors.
          # - `--max-time 30`: cap total waktu per-curl supaya satu
          #   curl gak nge-hang 4 menit kalau betul-betul down.
          # - `sleep 10` (was 5): nambah headroom untuk cold pm2 start.
          sleep 10
          CURL_OPTS=(--retry 5 --retry-delay 3 --retry-connrefused --max-time 30)
          # Frontend di-serve nginx di prefix /vipos/.
          curl -fsS "${CURL_OPTS[@]}" -o /dev/null -w "frontend HTTP %{http_code}\n" "http://${VPS_HOST}/vipos/"
          # Backend health endpoint via nginx -> proxy.
          curl -fsS "${CURL_OPTS[@]}" -o /dev/null -w "health   HTTP %{http_code}\n" "http://${VPS_HOST}/vipos/api/health"
          # Disk-usage probe (PR #102 + #155). Informational only — we do
          # NOT use `-fsS` here so a 503 (`status:high_usage` >=90% disk
          # full, or `status:no_mount` if BACKUP_DIR isn't mounted) shows
          # up in the deploy log but does NOT block the deploy. Blocking
          # deploys on a near-full disk would create a catch-22 where a
          # disk-cleanup fix can't ship because the disk is too full.
          # Surface the signal, let humans triage.
          curl -sS "${CURL_OPTS[@]}" -o /dev/null -w "disk     HTTP %{http_code}\n" "http://${VPS_HOST}/vipos/api/v1/health/disk" || true
          # Backup-freshness probe (PR #97). Same informational-only
          # contract as the disk probe above: 503 means the most recent
          # Postgres dump is older than threshold_hours (default 25),
          # which is a real signal but not something a code-deploy can
          # fix mid-flight (it'd need an out-of-band db-backup job
          # restart). Surface in the log, let humans triage.
          curl -sS "${CURL_OPTS[@]}" -o /dev/null -w "backup   HTTP %{http_code}\n" "http://${VPS_HOST}/vipos/api/v1/health/backup" || true
